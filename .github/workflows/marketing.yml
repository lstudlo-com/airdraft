name: Marketing website

on:
  push:
    branches: [main]
    paths:
      - apps/marketing/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .prototools
      - .moon/**
      - .github/workflows/marketing.yml
  pull_request:
    paths:
      - apps/marketing/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .prototools
      - .moon/**
      - .github/workflows/marketing.yml

permissions:
  contents: read

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:marketing
      - run: pnpm build:marketing
      - name: Validate Cloudflare deployment package
        run: pnpm --filter @airdraft/marketing exec wrangler deploy --dry-run
