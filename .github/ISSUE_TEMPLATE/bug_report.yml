name: Bug report
description: Something in Airdraft does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove API keys, transcripts and other personal data
        from anything you paste. Report security problems privately instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose …
        2. Hold the shortcut in …
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Airdraft version
      description: Settings > Updates shows the version. For a source build, add the commit.
      placeholder: 0.10.2 (218), or main at abc1234
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Official build
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Air M3
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Speech model, refinement provider and target app
      description: For example "Parakeet (local), LM Studio, typing into Slack".
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: |
        Optional. Logs: /usr/bin/log show --last 10m --predicate 'subsystem == "com.lightiichen.airdraft"' --style compact
      render: text
