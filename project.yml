name: airdraft
options:
  bundleIdPrefix: com.lightiichen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: YCC3HE6KCZ
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  AirdraftCore:
    path: Packages/AirdraftCore
targets:
  airdraft:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: AirdraftCore
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Airdraft
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "Airdraft 需要麥克風來進行語音聽寫。"
        NSHumanReadableCopyright: ""
    entitlements:
      path: Sources/App/airdraft.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        # Keep the installed app's identity so settings and permission grants survive the rename.
        PRODUCT_BUNDLE_IDENTIFIER: com.lightiichen.transcribar
        PRODUCT_NAME: airdraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
schemes:
  airdraft:
    build:
      targets:
        airdraft: all
    run:
      config: Debug
    test:
      config: Debug
      # Core tests build into the app's DerivedData instead of a second SwiftPM tree.
      targets:
        - package: AirdraftCore/AirdraftCoreTests
