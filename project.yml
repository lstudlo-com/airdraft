name: airdraft
options:
  bundleIdPrefix: com.lightiichen
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
  xcodeVersion: "26.0"
# Source builds sign ad-hoc unless the git-ignored Config/Local.xcconfig names a
# team (see Config/Local.xcconfig.example). Releases pass the pinned identity
# from scripts/release-signing.json on the command line instead. Hardened Runtime
# lives in Config/Signing.xcconfig: on for team-signed builds and releases, off
# for team-less ad-hoc builds whose frameworks library validation would reject.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    # Swift 6 language mode: data races are compile errors, as in AirdraftCore.
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    # String Catalogs: the compiler extracts localizable literals during builds.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  AirdraftCore:
    path: Packages/AirdraftCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # Opt-in product telemetry and crash reports, configured only in official
  # non-Debug builds after consent. See docs/telemetry.md.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.92.4
targets:
  airdraft:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: AirdraftCore
        embed: true
      - package: Sparkle
      - package: PostHog
    preBuildScripts:
      # Debug builds warn when this folder is off main or behind origin/main.
      # Local refs only; it never fails or slows the build.
      - name: Check Checkout
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            /usr/bin/python3 "$SRCROOT/scripts/check-checkout.py" --xcode || true
          fi
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: "$(AIRDRAFT_DISPLAY_NAME)"
        CFBundleLocalizations: [en, ar, es, fr, hi, id, ja, pt-BR, ru, zh-Hans, zh-Hant]
        CFBundleShortVersionString: "0.13.0"
        CFBundleVersion: "1"
        AirdraftDistribution: "$(AIRDRAFT_DISTRIBUTION)"
        AirdraftPolarEnvironment: "$(AIRDRAFT_POLAR_ENVIRONMENT)"
        AirdraftPolarOrganization: "$(AIRDRAFT_POLAR_ORGANIZATION)"
        AirdraftPolarBenefits: "$(AIRDRAFT_POLAR_BENEFITS)"
        AirdraftCheckoutURL: "$(AIRDRAFT_CHECKOUT_URL)"
        AirdraftCustomerPortalURL: "$(AIRDRAFT_CUSTOMER_PORTAL_URL)"
        AirdraftTrialDays: "$(AIRDRAFT_TRIAL_DAYS)"
        AirdraftTelemetryToken: "$(AIRDRAFT_TELEMETRY_TOKEN)"
        AirdraftTelemetryHost: "$(AIRDRAFT_TELEMETRY_HOST)"
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSMicrophoneUsageDescription: "Airdraft uses the microphone for dictation and meeting recordings."
        NSAudioCaptureUsageDescription: "Airdraft records audio from the meeting app you choose for transcription."
        NSHumanReadableCopyright: ""
        SUFeedURL: https://github.com/lstudlo-com/airdraft/releases/latest/download/appcast.xml
        SUPublicEDKey: "OfxXCWN57nT7jmfbzyk6meZT19SD10JU9Z6fyhBA6Nc="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        SURequireSignedFeed: true
    entitlements:
      path: Sources/App/airdraft.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        # Product identity; AppIdentity imports legacy settings and credentials.
        PRODUCT_BUNDLE_IDENTIFIER: com.lstudlo.app.airdraft
        PRODUCT_NAME: airdraft
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        AIRDRAFT_DISPLAY_NAME: Airdraft
        # Ordinary source builds are fully unlocked. Only the official release
        # workflow opts into licensing after validating public merchant config.
        AIRDRAFT_DISTRIBUTION: community
        AIRDRAFT_POLAR_ENVIRONMENT: production
        AIRDRAFT_POLAR_ORGANIZATION: ""
        AIRDRAFT_POLAR_BENEFITS: ""
        AIRDRAFT_CHECKOUT_URL: ""
        AIRDRAFT_CUSTOMER_PORTAL_URL: ""
        AIRDRAFT_TRIAL_DAYS: "14"
        # Official releases pass the public PostHog project token and host from
        # scripts/telemetry-config.json. Every other build leaves them empty and
        # never offers telemetry. See docs/telemetry.md.
        AIRDRAFT_TELEMETRY_TOKEN: ""
        AIRDRAFT_TELEMETRY_HOST: ""
      configs:
        Release:
          # Never ship Xcode's debug entitlements. The release script pins and
          # validates the certificate; it must not override signing with '-'.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        Debug:
          AIRDRAFT_POLAR_ENVIRONMENT: sandbox
          PRODUCT_BUNDLE_IDENTIFIER: com.lstudlo.app.airdraft.debug
          PRODUCT_NAME: Airdraft Debug
          AIRDRAFT_DISPLAY_NAME: Airdraft Debug
  # Logic tests for App-only code. The bundle compiles the App sources itself
  # instead of loading the app as a test host, so no test launches Airdraft,
  # reads its preferences or history, or starts hotkeys, the menu or the updater.
  AirdraftAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/App
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "*.xcstrings"
          - "Assets.xcassets"
          - "Resources"
      - path: Tests/AirdraftAppTests
    dependencies:
      - package: AirdraftCore
        embed: true
      - package: Sparkle
      - package: PostHog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lstudlo.app.airdraft.apptests
        PRODUCT_NAME: AirdraftAppTests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSPrincipalClass: AirdraftAppTests.TestBundleSetup
        # The app target owns string extraction for the catalogues.
        SWIFT_EMIT_LOC_STRINGS: NO
schemes:
  airdraft:
    build:
      targets:
        airdraft: all
    run:
      config: Debug
    test:
      config: Debug
      # Core tests build into the app's DerivedData instead of a second SwiftPM tree.
      targets:
        - package: AirdraftCore/AirdraftCoreTests
        - AirdraftAppTests
