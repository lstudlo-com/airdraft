$schema: https://moonrepo.dev/schemas/project.json

language: swift
layer: application

# Xcode manages its own incremental builds outside the repository.
# A moon cache hit must not skip rebuilding a missing app or test bundle.
taskOptions:
  cache: false
  mutex: airdraft-xcode

tasks:
  prepare:
    description: Repackage the native speech libraries. Run once after cloning.
    command: bash scripts/make-sherpa-xcframeworks.sh
    toolchains: system
    options:
      runInCI: false

  generate:
    description: Generate the Xcode project from project.yml.
    command: xcodegen generate
    toolchains: system

  build:
    description: Build the Airdraft macOS app.
    command: xcodebuild -project airdraft.xcodeproj -scheme airdraft -configuration Debug -skipPackagePluginValidation -skipMacroValidation build
    toolchains: system
    deps: [generate]

  test:
    description: Run AirdraftCore tests in the app's Xcode build tree.
    command: xcodebuild -project airdraft.xcodeproj -scheme airdraft -configuration Debug -skipPackagePluginValidation -skipMacroValidation test
    toolchains: system
    deps: [generate]

  build-release:
    description: Build an optimized Apple Silicon app for packaging.
    command: xcodebuild -project airdraft.xcodeproj -scheme airdraft -configuration Release -destination generic/platform=macOS ARCHS=arm64 -skipPackagePluginValidation -skipMacroValidation build
    toolchains: system
    deps: [generate]

  release-setup:
    description: Install the local hook that builds a DMG on pushes to main.
    command: python3 scripts/release.py install-hook
    toolchains: system
    options:
      runInCI: false

  release-prepare:
    description: Test committed sources, build a DMG locally, and upload a verified draft.
    command: python3 scripts/release.py prepare
    toolchains: system
    options:
      runInCI: false

  release-publish:
    description: Recover publication after a successful main push.
    command: python3 scripts/release.py publish
    toolchains: system
